name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Audit Go source and dependencies
        env:
          GOTOOLCHAIN: go1.25.13
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
