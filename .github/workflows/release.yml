name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Audit source before release
        env:
          GOTOOLCHAIN: go1.25.13
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o sibil-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o sibil-linux-arm64 .

      - name: Generate checksums
        run: sha256sum sibil-linux-amd64 sibil-linux-arm64 install.sh > checksums.txt

      - name: Audit release binaries
        env:
          GOTOOLCHAIN: go1.25.13
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary ./sibil-linux-amd64
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary ./sibil-linux-arm64

      # Only on an actual tag push: attest + publish. workflow_dispatch runs
      # build+checksum only, as a dry run, so we can validate the pipeline
      # without creating an attestation or release tied to a non-release commit.
      - name: Attest checksums
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-checksums: checksums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            sibil-linux-amd64 sibil-linux-arm64 checksums.txt install.sh \
            --title "${{ github.ref_name }}" \
            --notes "Built and provenance-attested by GitHub Actions from this exact commit. Verify with: gh attestation verify sibil-linux-amd64 -R sibil-monitor/sibil-agent"
